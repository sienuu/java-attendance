
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>JAVA Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #101010;
      color: #fff;
      min-height: 100vh;
      padding: 18px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 22px 10px;
    }

    .logo {
      width: 65px;
      height: 65px;
      border: 2px solid white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px;
      font-size: 25px;
      font-weight: 900;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 5px;
    }

    header p {
      color: #999;
      font-size: 12px;
      margin-top: 7px;
      letter-spacing: 2px;
    }

    .panel {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      color: #aaa;
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    #clock {
      font-size: 25px;
      font-weight: bold;
      text-align: center;
    }

    #date {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 15px;
      outline: none;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #reader video {
      border-radius: 12px;
      object-fit: cover;
    }

    #reader img {
      display: none;
    }

    .camera-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .primary {
      background: white;
      color: black;
      flex: 1;
    }

    .secondary {
      background: #333;
      color: white;
      flex: 1;
      border: 1px solid #555;
    }

    .status {
      padding: 13px;
      border-radius: 10px;
      background: #252525;
      color: #bbb;
      text-align: center;
      font-size: 13px;
      margin-top: 13px;
      line-height: 1.5;
    }

    .status.success {
      background: #12351f;
      color: #7dffa3;
    }

    .status.error {
      background: #401b1b;
      color: #ff9b9b;
    }

    .status.warning {
      background: #3c3013;
      color: #ffdb78;
    }

    .student-name {
      font-size: 21px;
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
    }

    .student-id {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    .record-details {
      margin-top: 15px;
      border-top: 1px solid #333;
      padding-top: 12px;
      font-size: 13px;
      line-height: 2;
      color: #ccc;
    }

    .record-details strong {
      color: white;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 11px;
      padding: 15px 0;
      letter-spacing: 1px;
    }

    @media (max-width: 380px) {
      body {
        padding: 10px;
      }

      header h1 {
        font-size: 24px;
      }

      .panel {
        padding: 14px;
      }

      button {
        padding: 12px 8px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="logo">J</div>
      <h1>JAVA</h1>
      <p>ORGANIZATION ATTENDANCE SYSTEM</p>
    </header>

    <section class="panel">
      <div class="section-title">CURRENT DATE AND TIME</div>
      <div id="clock">--:--:--</div>
      <div id="date">Loading date...</div>
    </section>

    <section class="panel">
      <div class="section-title">ATTENDANCE SESSION</div>

      <label for="session">SELECT SESSION</label>
      <select id="session">
        <option value="MORNING_IN">MORNING IN — 7:00 AM</option>
        <option value="MORNING_OUT">MORNING OUT — 12:00 PM</option>
        <option value="AFTERNOON_IN">AFTERNOON IN — 1:00 PM</option>
        <option value="AFTERNOON_OUT">AFTERNOON OUT — 4:00 PM</option>
      </select>
    </section>

    <section class="panel">
      <div class="section-title">SCAN STUDENT QR CODE</div>

      <div id="reader"></div>

      <div class="camera-buttons">
        <button class="primary" id="startBtn" onclick="startCamera()">
          START CAMERA
        </button>

        <button class="secondary" id="stopBtn" onclick="stopCamera()" disabled>
          STOP CAMERA
        </button>
      </div>

      <div class="status" id="cameraStatus">
        Camera is not running. Press START CAMERA.
      </div>
    </section>

    <section class="panel">
      <div class="section-title">ATTENDANCE RESULT</div>

      <div id="result">
        <div class="status">Waiting for QR code scan...</div>
      </div>
    </section>

    <div class="footer">
      JAVA ORGANIZATION · ATTENDANCE MANAGEMENT
    </div>

  </main>

<script>
  // ==========================================
  // GOOGLE APPS SCRIPT WEB APP URL
  // ==========================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbz6_8ZuGMudlE9wf1Zb1ymVIh8B4Gl88JhRD7XqWKCYgdhz8ytv5XZfdyCSV4stIMqQgA/exec";

  // ==========================================
  // APPLICATION SETTINGS
  // ==========================================

  let scanner = null;
  let cameraRunning = false;
  let processing = false;
  let cameras = [];
  let currentCameraIndex = 0;
  let lastScannedId = "";

  const reader = document.getElementById("reader");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const cameraStatus = document.getElementById("cameraStatus");
  const result = document.getElementById("result");

  // ==========================================
  // PHILIPPINE DATE AND TIME
  // ==========================================

  function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
      new Intl.DateTimeFormat("en-PH", {
        timeZone: "Asia/Manila",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).format(now);

    document.getElementById("date").textContent =
      new Intl.DateTimeFormat("en-PH", {
        timeZone: "Asia/Manila",
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(now);
  }

  updateClock();
  setInterval(updateClock, 1000);

  // ==========================================
  // JSONP API CONNECTION
  // ==========================================

  function apiCall(params) {
    return new Promise((resolve, reject) => {
      const callbackName =
        "javaCallback_" + Date.now() + "_" +
        Math.floor(Math.random() * 100000);

      const script = document.createElement("script");
      const query = new URLSearchParams({
        ...params,
        callback: callbackName
      });

      let finished = false;

      const timeout = setTimeout(() => {
        finish();
        reject(new Error("Connection timed out. Please check your internet or Apps Script deployment."));
      }, 15000);

      function finish() {
        if (finished) return;
        finished = true;

        clearTimeout(timeout);
        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = function(data) {
        finish();
        resolve(data);
      };

      script.onerror = function() {
        finish();
        reject(new Error("Unable to connect to the attendance server."));
      };

      script.src = API_URL + "?" + query.toString();
      document.body.appendChild(script);
    });
  }

  // ==========================================
  // CHECK SERVER CONNECTION
  // ==========================================

  async function checkConnection() {
    try {
      const data = await apiCall({
        action: "ping"
      });

      if (data && data.ok) {
        cameraStatus.textContent =
          "Connected to JAVA Attendance Database.";

        cameraStatus.className = "status success";
      } else {
        throw new Error(
          data && data.message
            ? data.message
            : "Server did not respond correctly."
        );
      }
    } catch (error) {
      cameraStatus.textContent =
        "Server connection problem: " + error.message;

      cameraStatus.className = "status error";
    }
  }

  checkConnection();

  // ==========================================
  // CAMERA INITIALIZATION
  // ==========================================

  async function startCamera() {
    if (cameraRunning) return;

    if (!window.Html5Qrcode) {
      cameraStatus.textContent =
        "QR scanner library failed to load. Check your internet connection.";

      cameraStatus.className = "status error";
      return;
    }

    startBtn.disabled = true;

    cameraStatus.textContent = "Starting camera...";
    cameraStatus.className = "status";

    try {
      scanner = new Html5Qrcode("reader");

      cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error("No camera was detected on this device.");
      }

      currentCameraIndex = findRearCamera(cameras);

      await startSelectedCamera();

      cameraRunning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;

      cameraStatus.textContent =
        "Camera is active. Point it at a student's QR code.";

      cameraStatus.className = "status success";

    } catch (error) {
      cameraRunning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      cameraStatus.textContent =
        "Camera error: " + error.message +
        " Make sure camera permission is allowed and open this site using HTTPS.";

      cameraStatus.className = "status error";
    }
  }

  function findRearCamera(cameraList) {
    const index = cameraList.findIndex(camera =>
      /back|rear|environment|world/i.test(camera.label)
    );

    return index >= 0 ? index : 0;
  }

  async function startSelectedCamera() {
    const selectedCamera = cameras[currentCameraIndex];

    await scanner.start(
      selectedCamera.id,
      {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const size = Math.min(
            viewfinderWidth,
            viewfinderHeight,
            280
          );

          return {
            width: size,
            height: size
          };
        },
        aspectRatio: 1.0
      },
      onScanSuccess,
      function() {
        // Ignore frames without a QR code.
      }
    );
  }

  // ==========================================
  // SWITCH CAMERA
  // ==========================================

  async function switchCamera() {
    if (!scanner || cameras.length < 2) {
      cameraStatus.textContent =
        "No second camera is available on this device.";

      cameraStatus.className = "status warning";
      return;
    }

    try {
      if (scanner.isScanning) {
        await scanner.stop();
      }

      currentCameraIndex =
        (currentCameraIndex + 1) % cameras.length;

      await startSelectedCamera();

      cameraStatus.textContent =
        "Switched camera: " + cameras[currentCameraIndex].label;

      cameraStatus.className = "status success";

    } catch (error) {
      cameraStatus.textContent =
        "Unable to switch camera: " + error.message;

      cameraStatus.className = "status error";
    }
  }

  // ==========================================
  // STOP CAMERA
  // ==========================================

  async function stopCamera() {
    try {
      if (scanner && scanner.isScanning) {
        await scanner.stop();
      }

      cameraRunning = false;
      processing = false;

      startBtn.disabled = false;
      stopBtn.disabled = true;

      cameraStatus.textContent = "Camera stopped.";
      cameraStatus.className = "status";

    } catch (error) {
      cameraStatus.textContent =
        "Unable to stop camera: " + error.message;

      cameraStatus.className = "status error";
    }
  }

  // ==========================================
  // QR CODE SCANNING
  // ==========================================

  async function onScanSuccess(decodedText) {
    if (processing) return;

    const studentId = decodedText.trim().toUpperCase();

    // QR codes should contain student IDs, e.g. JAVA001.
    if (!/^JAVA\d+$/i.test(studentId)) {
      showResult(
        "Invalid QR Code",
        "This QR code does not contain a valid JAVA student ID.",
        "error"
      );
      return;
    }

    processing = true;
    lastScannedId = studentId;

    const selectedSession =
      document.getElementById("session").value;

    showResult(
      "Processing Attendance",
      "Student ID: " + escapeHTML(studentId) +
      "<br>Please wait while we save the attendance.",
      ""
    );

    try {
      const data = await apiCall({
        action: "record",
        id: studentId,
        session: selectedSession
      });

      if (!data || !data.ok) {
        const duplicate = data && data.duplicate;

        showResult(
          duplicate ? "Already Recorded" : "Attendance Not Saved",
          escapeHTML(
            data && data.message
              ? data.message
              : "The attendance could not be recorded."
          ),
          duplicate ? "warning" : "error"
        );

      } else {
        const statusText = data.late ? "LATE" : "ON TIME";

        showResult(
          "Attendance Recorded!",
          `
            <div class="student-name">
              ${escapeHTML(data.name || "JAVA Member")}
            </div>

            <div class="student-id">
              ${escapeHTML(data.studentId || studentId)}
            </div>

            <div class="record-details">
              <div>Session: <strong>${escapeHTML(data.session || selectedSession)}</strong></div>
              <div>Date: <strong>${escapeHTML(data.date || "")}</strong></div>
              <div>Time: <strong>${escapeHTML(data.time || "")}</strong></div>
              <div>Status: <strong>${escapeHTML(data.status || statusText)}</strong></div>
            </div>
          `,
          "success"
        );
      }

    } catch (error) {
      showResult(
        "Connection Error",
        escapeHTML(error.message),
        "error"
      );

    } finally {
      processing = false;
    }
  }

  // ==========================================
  // DISPLAY RESULTS
  // ==========================================

  function showResult(title, message, type) {
    const className = type
      ? "status " + type
      : "status";

    result.innerHTML = `
      <div class="${className}">
        <strong>${escapeHTML(title)}</strong>
        <div style="margin-top:8px;">
          ${message}
        </div>
      </div>
    `;
  }

  // ==========================================
  // BASIC HTML ESCAPING
  // ==========================================

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

</script>

</body>
</html>
